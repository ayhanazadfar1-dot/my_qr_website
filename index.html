}

}
footer {
    margin-top: 50px;

}
body {
    margin: 0;
    background: linear-gradient(to right, lightblue, white);
}

h1 {
    margin-top: 40px;
}
#qrcode {
    background-color: white;
    display: inline-block;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}
#qrcode {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: fit-content;
    margin: 20px auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

#qrcode img {
    display: block;
}
button {
    background: white;
    color: #2575fc;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    transform: scale(1.05);
}

    outline: none;
    box-shadow: 0 0 10px rgba(255,255,255,0.7);
    transform: scale(1.02);

@media (max-width: 600px) {
    h1 {

    input {

    }
}
    </style>
</head>

<body>
<nav>
    <a href="#">خانه</a>
    <a href="#qrcode">ساخت QR Code</a>
</nav>
    <h1>QR Code ساز من 🚀</h1>    
    <p>به سایت من خوش آمدید.</p>
    <img src="https://via.placeholder.com/300" alt="تصویر سایت">
    <section>
    <h2>درباره سایت</h2>
    <p>اینجا می‌توانی لینک خودت را وارد کنی و QR Code بسازی.</p>
</section>
    <button onclick="alert('سلام!')">کلیک کن</button>
    <h2>ساخت QR Code</h2>

<input id="link" type="text" placeholder="لینک را وارد کن">
<button onclick="makeQR()">ساخت QR</button>
<button onclick="clearQR()">پاک کردن</button>
<button onclick="copyLink()">کپی لینک</button>
<button onclick="downloadQR()">دانلود QR</button>
<div id="qrcode"></div>
<script>
function copyLink() {
    let link = document.getElementById("link").value;

    if (link == "") {
        alert("اول یک لینک وارد کن");
        return;
    }

    navigator.clipboard.writeText(link);
    alert("لینک کپی شد!");
}

function downloadQR() {
    let img = document.querySelector("#qrcode img");

    if (!img) {
        alert("اول یک QR Code بساز");
        return;
    }

    let link = document.createElement("a");
    link.href = img.src;
    link.download = "qrcode.png";
    link.target = "_blank";
    link.click();
}

function makeQR() {
    let link = document.getElementById("link").value;
if (!link.startsWith("http://") && !link.startsWith("https://")) {
    link = "https://" + link;
}
    if (link == "") {
        alert("لطفاً یک لینک وارد کن");
        return;
    }

    let qr = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="
        + encodeURIComponent(link);

    document.getElementById("qrcode").innerHTML =
        "<img src='" + qr + "'>";
}
</script>
<footer>
    <p>© 2026 سایت من</p>
</footer>
<style>
body {
    font-family: Arial, sans-serif;

}

input {
    padding: 12px;
    width: 80%;
    max-width: 400px;

}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;

    font-size: 16px;
    margin: 5px;
}
</style>
</body>
